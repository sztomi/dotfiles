font_family      Iosevka Custom Extended
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13

shell_integration        enabled no-cursor
hide_window_decorations  no
remember_window_size     yes

map ctrl+shift+F send_text all \x1b[70;5u

linux_display_server x11

# Based on Tango Light
background #ffffff
foreground #000000
cursor #000000
selection_background #b4d5ff

# Black & gray
color0 #000000
color8 #484a46

# Red
color1 #cc0000
color9 #ef2929

# Green
color2 #4eaa06
color10 #8aca3e

# Yellow
color3 #D2A614
color11 #fce94f

# Blue
color4 #3465a4
color12 #729fcf

# Magenta
color5 #92479A
color13 #C06CBB

# Cyan
color6 #06989a
color14 #34e2e2

# White
color7 #d3d7cf
color15 #8f8f8d

selection_foreground #ffffff
